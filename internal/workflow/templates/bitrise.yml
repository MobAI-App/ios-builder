# Generated by ios-builder. Use repository YAML mode and commit this file and .builder/ci/runner.sh.
format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios
meta:
  bitrise.io:
    machine_type_id: g2.mac.medium
workflows:
  ios-build:
    meta:
      bitrise.io:
        machine_type_id: g2.mac.medium
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: {}
      - script@1:
          title: Build IPA from snapshot
          timeout: 1800
          inputs:
            - content: |-
                #!/bin/bash
                set -euo pipefail
                mkdir -p "$HOME/.ios-builder-ci"
                cp .builder/ci/runner.sh "$HOME/.ios-builder-ci/runner.sh"
                bash "$HOME/.ios-builder-ci/runner.sh" build
                mkdir -p "$BITRISE_DEPLOY_DIR"
                # Bitrise's installable-IPA uploader requires a provisioning
                # profile. Send unsigned IPAs as generic ZIP artifacts instead;
                # the bytes are unchanged and Builder restores the .ipa name.
                artifact_name="$BUILD_ID.ipa"
                if [ "${USE_SIGNING:-false}" != true ]; then artifact_name="$artifact_name.zip"; fi
                cp "build/$BUILD_ID.ipa" "$BITRISE_DEPLOY_DIR/$artifact_name"
      - deploy-to-bitrise-io@2:
          inputs:
            - is_enable_public_page: "false"
            - notify_user_groups: "none"
  ios-share:
    meta:
      bitrise.io:
        machine_type_id: g2.mac.medium
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: {}
      - script@1:
          title: Build and share simulator
          timeout: 5400
          inputs:
            - content: |-
                #!/bin/bash
                set -euo pipefail
                mkdir -p "$HOME/.ios-builder-ci"
                cp .builder/ci/runner.sh "$HOME/.ios-builder-ci/runner.sh"
                bash "$HOME/.ios-builder-ci/runner.sh" simulator
                bash "$HOME/.ios-builder-ci/runner.sh" share
