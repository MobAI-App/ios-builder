# Generated by ios-builder. Use repository YAML mode and commit this file and .builder/ci/runner.sh.
# Caches use Bitrise's key-based restore-cache/save-cache steps: DerivedData,
# Swift packages, Pods, node_modules, the pub cache, Gradle and ccache.
format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios
meta:
  bitrise.io:
    machine_type_id: g2.mac.medium
workflows:
  ios-build:
    meta:
      bitrise.io:
        machine_type_id: g2.mac.medium
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: {}
      - script@1:
          title: Check out the snapshot
          inputs:
            - content: |-
                #!/bin/bash
                set -euo pipefail
                # Copied before the checkout: the snapshot need not carry runner.sh.
                mkdir -p "$HOME/.ios-builder-ci"
                cp .builder/ci/runner.sh "$HOME/.ios-builder-ci/runner.sh"
                bash "$HOME/.ios-builder-ci/runner.sh" checkout
      # The cache keys checksum the snapshot's lockfiles, so these steps come
      # after the checkout and before the build. The keys fall back to a prefix
      # match, and the matching save steps below write the exact keys.
      - restore-cache@3:
          title: Restore DerivedData
          inputs:
            - key: deriveddata-device-{{ .OS }}-{{ .Arch }}-
      - restore-cache@3:
          title: Restore Swift packages
          inputs:
            - key: |-
                spm-{{ .OS }}-{{ .Arch }}-{{ checksum "$IOS_PATH/*.xcworkspace/xcshareddata/swiftpm/Package.resolved" "$IOS_PATH/*.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved" }}
                spm-{{ .OS }}-{{ .Arch }}-
      - restore-cache@3:
          title: Restore Pods
          inputs:
            - key: |-
                pods-{{ .OS }}-{{ .Arch }}-{{ checksum "$IOS_PATH/Podfile.lock" }}
                pods-{{ .OS }}-{{ .Arch }}-
      - restore-cache@3:
          title: Restore node_modules
          inputs:
            - key: |-
                node-modules-{{ .OS }}-{{ .Arch }}-{{ checksum "package.json" "package-lock.json" "yarn.lock" "pnpm-lock.yaml" "bun.lock" "bun.lockb" }}
                node-modules-{{ .OS }}-{{ .Arch }}-
          outputs:
            - BITRISE_CACHE_HIT: NODE_MODULES_CACHE_HIT
      - restore-cache@3:
          title: Restore pub cache
          inputs:
            - key: |-
                pub-{{ .OS }}-{{ .Arch }}-{{ checksum "pubspec.lock" }}
                pub-{{ .OS }}-{{ .Arch }}-
      - restore-cache@3:
          title: Restore Gradle
          inputs:
            - key: |-
                gradle-{{ .OS }}-{{ .Arch }}-{{ checksum "*.gradle*" "*/*.gradle*" "gradle/*.versions.toml" "gradle/wrapper/gradle-wrapper.properties" }}
                gradle-{{ .OS }}-{{ .Arch }}-
      - restore-cache@3:
          title: Restore ccache
          inputs:
            - key: ccache-device-{{ .OS }}-{{ .Arch }}-
      - script@1:
          title: Build IPA from snapshot
          timeout: 1800
          inputs:
            - content: |-
                #!/bin/bash
                set -euo pipefail
                # An exact node_modules hit skips the install, as on GitHub.
                if [ "${NODE_MODULES_CACHE_HIT:-}" = exact ]; then export JS_DEPS_CACHED=true; fi
                bash "$HOME/.ios-builder-ci/runner.sh" build
                mkdir -p "$BITRISE_DEPLOY_DIR"
                # Bitrise's installable-IPA uploader requires a provisioning
                # profile. Send unsigned IPAs as generic ZIP artifacts instead;
                # the bytes are unchanged and Builder restores the .ipa name.
                artifact_name="$BUILD_ID.ipa"
                if [ "${USE_SIGNING:-false}" != true ]; then artifact_name="$artifact_name.zip"; fi
                cp "build/$BUILD_ID.ipa" "$BITRISE_DEPLOY_DIR/$artifact_name"
      - deploy-to-bitrise-io@2:
          inputs:
            - is_enable_public_page: "false"
            - notify_user_groups: "none"
      # DerivedData and ccache are content-addressed and keyed per build, so
      # they are saved even when the build fails. The dependency caches are
      # saved only after a successful build, under their lockfile checksums;
      # a path that does not exist is skipped with a warning.
      - save-cache@1:
          title: Save DerivedData
          is_always_run: true
          inputs:
            - key: deriveddata-device-{{ .OS }}-{{ .Arch }}-{{ getenv "BITRISE_BUILD_NUMBER" }}
            - paths: DerivedData
      - save-cache@1:
          title: Save ccache
          is_always_run: true
          inputs:
            - key: ccache-device-{{ .OS }}-{{ .Arch }}-{{ getenv "BITRISE_BUILD_NUMBER" }}
            - paths: ~/.ccache
      - save-cache@1:
          title: Save Swift packages
          inputs:
            - key: spm-{{ .OS }}-{{ .Arch }}-{{ checksum "$IOS_PATH/*.xcworkspace/xcshareddata/swiftpm/Package.resolved" "$IOS_PATH/*.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved" }}
            - paths: ~/.ios-builder/SourcePackages
      - save-cache@1:
          title: Save Pods
          inputs:
            - key: pods-{{ .OS }}-{{ .Arch }}-{{ checksum "$IOS_PATH/Podfile.lock" }}
            - paths: |-
                $IOS_PATH/Pods
                ~/.cocoapods/repos
      - save-cache@1:
          title: Save node_modules
          inputs:
            - key: node-modules-{{ .OS }}-{{ .Arch }}-{{ checksum "package.json" "package-lock.json" "yarn.lock" "pnpm-lock.yaml" "bun.lock" "bun.lockb" }}
            - paths: node_modules
      - save-cache@1:
          title: Save pub cache
          inputs:
            - key: pub-{{ .OS }}-{{ .Arch }}-{{ checksum "pubspec.lock" }}
            - paths: ~/.pub-cache
      - save-cache@1:
          title: Save Gradle
          inputs:
            - key: gradle-{{ .OS }}-{{ .Arch }}-{{ checksum "*.gradle*" "*/*.gradle*" "gradle/*.versions.toml" "gradle/wrapper/gradle-wrapper.properties" }}
            - paths: |-
                ~/.gradle/caches
                ~/.gradle/wrapper
  ios-share:
    meta:
      bitrise.io:
        machine_type_id: g2.mac.medium
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: {}
      - script@1:
          title: Check out the snapshot
          inputs:
            - content: |-
                #!/bin/bash
                set -euo pipefail
                # Copied before the checkout: the snapshot need not carry runner.sh.
                mkdir -p "$HOME/.ios-builder-ci"
                cp .builder/ci/runner.sh "$HOME/.ios-builder-ci/runner.sh"
                bash "$HOME/.ios-builder-ci/runner.sh" checkout
      # The cache keys checksum the snapshot's lockfiles, so these steps come
      # after the checkout and before the build. The keys fall back to a prefix
      # match, and the matching save steps below write the exact keys.
      - restore-cache@3:
          title: Restore DerivedData
          inputs:
            - key: deriveddata-sim-{{ .OS }}-{{ .Arch }}-
      - restore-cache@3:
          title: Restore Swift packages
          inputs:
            - key: |-
                spm-{{ .OS }}-{{ .Arch }}-{{ checksum "$IOS_PATH/*.xcworkspace/xcshareddata/swiftpm/Package.resolved" "$IOS_PATH/*.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved" }}
                spm-{{ .OS }}-{{ .Arch }}-
      - restore-cache@3:
          title: Restore Pods
          inputs:
            - key: |-
                pods-{{ .OS }}-{{ .Arch }}-{{ checksum "$IOS_PATH/Podfile.lock" }}
                pods-{{ .OS }}-{{ .Arch }}-
      - restore-cache@3:
          title: Restore node_modules
          inputs:
            - key: |-
                node-modules-{{ .OS }}-{{ .Arch }}-{{ checksum "package.json" "package-lock.json" "yarn.lock" "pnpm-lock.yaml" "bun.lock" "bun.lockb" }}
                node-modules-{{ .OS }}-{{ .Arch }}-
          outputs:
            - BITRISE_CACHE_HIT: NODE_MODULES_CACHE_HIT
      - restore-cache@3:
          title: Restore pub cache
          inputs:
            - key: |-
                pub-{{ .OS }}-{{ .Arch }}-{{ checksum "pubspec.lock" }}
                pub-{{ .OS }}-{{ .Arch }}-
      - restore-cache@3:
          title: Restore Gradle
          inputs:
            - key: |-
                gradle-{{ .OS }}-{{ .Arch }}-{{ checksum "*.gradle*" "*/*.gradle*" "gradle/*.versions.toml" "gradle/wrapper/gradle-wrapper.properties" }}
                gradle-{{ .OS }}-{{ .Arch }}-
      - restore-cache@3:
          title: Restore ccache
          inputs:
            - key: ccache-sim-{{ .OS }}-{{ .Arch }}-
      - script@1:
          title: Build for the simulator
          timeout: 1800
          inputs:
            - content: |-
                #!/bin/bash
                set -euo pipefail
                # An exact node_modules hit skips the install, as on GitHub.
                if [ "${NODE_MODULES_CACHE_HIT:-}" = exact ]; then export JS_DEPS_CACHED=true; fi
                bash "$HOME/.ios-builder-ci/runner.sh" simulator
      # Saved before the share step, which blocks for as long as the
      # simulator is in use.
      # DerivedData and ccache are content-addressed and keyed per build, so
      # they are saved even when the build fails. The dependency caches are
      # saved only after a successful build, under their lockfile checksums;
      # a path that does not exist is skipped with a warning.
      - save-cache@1:
          title: Save DerivedData
          is_always_run: true
          inputs:
            - key: deriveddata-sim-{{ .OS }}-{{ .Arch }}-{{ getenv "BITRISE_BUILD_NUMBER" }}
            - paths: DerivedData
      - save-cache@1:
          title: Save ccache
          is_always_run: true
          inputs:
            - key: ccache-sim-{{ .OS }}-{{ .Arch }}-{{ getenv "BITRISE_BUILD_NUMBER" }}
            - paths: ~/.ccache
      - save-cache@1:
          title: Save Swift packages
          inputs:
            - key: spm-{{ .OS }}-{{ .Arch }}-{{ checksum "$IOS_PATH/*.xcworkspace/xcshareddata/swiftpm/Package.resolved" "$IOS_PATH/*.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved" }}
            - paths: ~/.ios-builder/SourcePackages
      - save-cache@1:
          title: Save Pods
          inputs:
            - key: pods-{{ .OS }}-{{ .Arch }}-{{ checksum "$IOS_PATH/Podfile.lock" }}
            - paths: |-
                $IOS_PATH/Pods
                ~/.cocoapods/repos
      - save-cache@1:
          title: Save node_modules
          inputs:
            - key: node-modules-{{ .OS }}-{{ .Arch }}-{{ checksum "package.json" "package-lock.json" "yarn.lock" "pnpm-lock.yaml" "bun.lock" "bun.lockb" }}
            - paths: node_modules
      - save-cache@1:
          title: Save pub cache
          inputs:
            - key: pub-{{ .OS }}-{{ .Arch }}-{{ checksum "pubspec.lock" }}
            - paths: ~/.pub-cache
      - save-cache@1:
          title: Save Gradle
          inputs:
            - key: gradle-{{ .OS }}-{{ .Arch }}-{{ checksum "*.gradle*" "*/*.gradle*" "gradle/*.versions.toml" "gradle/wrapper/gradle-wrapper.properties" }}
            - paths: |-
                ~/.gradle/caches
                ~/.gradle/wrapper
      - script@1:
          title: Share the simulator
          timeout: 5400
          inputs:
            - content: |-
                #!/bin/bash
                set -euo pipefail
                bash "$HOME/.ios-builder-ci/runner.sh" share
