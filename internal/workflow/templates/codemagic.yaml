# Generated by ios-builder. Commit this file and .builder/ci/runner.sh to the configured branch.
# Codemagic caches by path, with no key: DerivedData, Gradle, the pub cache,
# Swift packages (runner.sh clones them into ~/.ios-builder/SourcePackages) and
# ccache (filled only with "cache": {"ccache": true} in builder.json).
workflows:
  ios-build:
    name: Builder iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      groups:
        - builder
    cache:
      cache_paths:
        - $CM_BUILD_DIR/DerivedData
        - $HOME/.gradle/caches
        - $HOME/.pub-cache
        - $HOME/.ios-builder/SourcePackages
        - $HOME/.ccache
    scripts:
      - name: Build IPA from snapshot
        script: |
          set -e
          mkdir -p "$HOME/.ios-builder-ci"
          cp .builder/ci/runner.sh "$HOME/.ios-builder-ci/runner.sh"
          bash "$HOME/.ios-builder-ci/runner.sh" build
    artifacts:
      - build/*.ipa
  ios-share:
    name: Builder iOS simulator
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      groups:
        - builder
    cache:
      cache_paths:
        - $CM_BUILD_DIR/DerivedData
        - $HOME/.gradle/caches
        - $HOME/.pub-cache
        - $HOME/.ios-builder/SourcePackages
        - $HOME/.ccache
    scripts:
      - name: Build simulator from snapshot
        script: |
          set -e
          mkdir -p "$HOME/.ios-builder-ci"
          cp .builder/ci/runner.sh "$HOME/.ios-builder-ci/runner.sh"
          bash "$HOME/.ios-builder-ci/runner.sh" simulator
      - name: Share the simulator
        script: bash "$HOME/.ios-builder-ci/runner.sh" share
